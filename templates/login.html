<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sentinel | Secure Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Smooth scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(148, 163, 184, 0.5);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(148, 163, 184, 0.8);
      }
    </style>
  </head>

  <!-- Soft, premium background matching the landing & register pages -->
  <body
    class="bg-[#f3f4f6] text-slate-800 min-h-screen flex items-center justify-center p-4 font-sans relative overflow-x-hidden"
  >
    <!-- THE AURORA BACKGROUND -->
    <div
      class="fixed top-0 left-1/4 w-[500px] h-[500px] bg-blue-400/30 rounded-full blur-[120px] pointer-events-none -z-10"
    ></div>
    <div
      class="fixed bottom-0 right-1/4 w-[600px] h-[600px] bg-indigo-400/20 rounded-full blur-[150px] pointer-events-none -z-10"
    ></div>
    <div
      class="fixed top-1/2 left-1/2 w-[400px] h-[400px] bg-purple-400/20 rounded-full blur-[100px] pointer-events-none -z-10"
    ></div>

    <!-- MAIN GLASS PANEL (Slimmer profile for just login) -->
    <div
      class="w-full max-w-md bg-white/40 backdrop-blur-2xl border border-white/60 p-8 md:p-10 rounded-[2rem] shadow-[0_20px_40px_rgba(0,0,0,0.08)] relative z-10 my-8"
    >
      <!-- Header -->
      <div class="text-center mb-8">
        <!-- Secure Lock Icon -->
        <div
          class="inline-flex items-center justify-center h-14 w-14 rounded-2xl bg-gradient-to-br from-blue-500 to-indigo-600 text-white mb-4 shadow-[0_8px_20px_rgba(79,70,229,0.3)]"
        >
          <svg
            class="w-7 h-7"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
            ></path>
          </svg>
        </div>
        <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">
          Welcome Back
        </h1>
        <p class="text-slate-500 text-sm mt-2 font-medium">
          Access your secure Sentinel terminal.
        </p>
      </div>

      <!-- Flask Error Message -->
      {% if error %}
      <div
        class="mb-6 p-4 rounded-xl bg-red-50/80 backdrop-blur-sm border border-red-200 text-red-600 text-sm font-medium flex items-center space-x-3 shadow-sm"
      >
        <svg
          class="w-5 h-5 flex-shrink-0"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
          ></path>
        </svg>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form action="/login" method="POST" class="space-y-6">
        <div>
          <label
            class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2"
            >Email Address</label
          >
          <input
            type="email"
            name="email"
            required
            placeholder="you@youremail.com"
            class="w-full bg-white/50 border border-white/60 focus:bg-white/80 focus:border-indigo-400 rounded-xl px-4 py-3 text-sm text-slate-900 placeholder-slate-400 outline-none transition shadow-sm"
          />
        </div>

        <div>
          <label
            class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2"
            >Password</label
          >
          <input
            type="password"
            name="password"
            required
            placeholder="••••••••"
            class="w-full bg-white/50 border border-white/60 focus:bg-white/80 focus:border-indigo-400 rounded-xl px-4 py-3 text-sm text-slate-900 placeholder-slate-400 outline-none transition shadow-sm"
          />
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          class="w-full py-4 mt-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-[0_8px_20px_rgba(79,70,229,0.3)] transition-all duration-300 text-sm tracking-wide uppercase"
        >
          Access System
        </button>
      </form>

      <p class="text-center text-sm font-medium text-slate-500 mt-8">
        Need an account?
        <a
          href="/register"
          class="text-indigo-600 hover:text-indigo-800 font-bold ml-1 transition-colors"
          >Register here</a
        >
      </p>
    </div>
  </body>
</html>
